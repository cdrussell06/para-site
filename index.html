<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PARAMORE</title>
  <link rel="stylesheet" href="css/style.css?v=108">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#9fb3c8"/><stop offset="0.5" stop-color="#3a4656"/><stop offset="0.75" stop-color="#cfe0f1"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2c9"/><stop offset="0.45" stop-color="#ff9a2e"/><stop offset="0.5" stop-color="#b53b00"/><stop offset="0.75" stop-color="#ff7a00"/><stop offset="1" stop-color="#ffe2b0"/></linearGradient>
  </defs></svg>
  <video class="bg-video" autoplay muted loop playsinline>
    <source src="videos/BackroundVid.mp4" type="video/mp4">
  </video>
  <div class="halftone"></div>

  <nav class="nav">
    <a href="#music">Music</a>
    <a href="#shop">Shop</a>
    <a href="#behind">Behind the Sound</a>
    <a href="#more">More Like Us</a>
  </nav>

  <header class="splash">
    <h1>PARAMORE</h1>
  </header>

  <main>
    <section id="music">
      <h2>Music</h2>
      <div class="music-artwork" aria-hidden="true">
        <img class="music-speakers" src="imgs/music/speakers.jpg" alt="">
        <img class="music-ornamental" src="imgs/music/ornamental.jpg" alt="">
        <img class="music-splatter music-splatter-a" src="imgs/music/splatter-a.jpg" alt="">
        <img class="music-splatter music-splatter-b" src="imgs/music/splatter-b.jpg" alt="">
      </div>
      <div class="cd-bin"></div>
    </section>
    <section id="shop"><h2>Shop</h2><div class="shop-rows"></div></section>
    <section id="behind">
      <h2>Behind the Sound</h2>
      <div class="stage"><aside class="vid-col vid-left"></aside><div class="member-panel"></div><aside class="vid-col vid-right"></aside></div>
      <p class="photo-credit">Photos: <a href="https://commons.wikimedia.org" target="_blank" rel="noopener">Wikimedia Commons</a></p>
    </section>
    <section id="more">
      <h2>More Like Us</h2>
      <div class="artist-browser">
        <div class="artists" aria-label="Related artists"></div>
        <div class="artist-controls">
          <button class="artist-scroll" type="button" data-direction="-1" aria-label="Scroll artists left">&larr;</button>
          <button class="artist-scroll" type="button" data-direction="1" aria-label="Scroll artists right">&rarr;</button>
        </div>
      </div>
    </section>
  </main>

  <script src="js/script.js?v=107"></script>
</body>
</html>
